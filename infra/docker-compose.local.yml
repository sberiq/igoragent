services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: igoragent
      POSTGRES_USER: igoragent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igoragent -d igoragent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-local-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file: ../.env
    environment:
      IGORAGENT_LOCAL_MODE: "true"
      IGORAGENT_COOKIE_SECURE: "false"
      IGORAGENT_ALLOWED_ORIGINS: http://localhost:3000
      IGORAGENT_CONFIG_PATH: /var/lib/igoragent/configuration.json
      TELEGRAM_SESSION_PATH: /var/lib/igoragent/telegram.session
    volumes:
      - igoragent-local-state:/var/lib/igoragent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.local
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-local-data:
  redis-local-data:
  igoragent-local-state:
